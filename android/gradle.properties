org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround for "Could not close incremental caches" on this machine —
# something (most likely Windows Defender real-time scanning, since the
# project dir isn't excluded and admin rights aren't available to add one)
# is interrupting Gradle/Kotlin while it writes the incremental compile
# cache under build/**/kotlin/compileDebugKotlin/cacheable. Disabling
# incremental Kotlin compilation avoids that write entirely. Safe to
# remove once E:\Protein_cuts and %USERPROFILE%\.gradle are excluded from
# real-time scanning.
kotlin.incremental=false
org.gradle.parallel=false
org.gradle.workers.max=1
