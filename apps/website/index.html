    <!-- Outfit/Dancing Script cover Latin only — none of Tamil, Hindi
         (Devanagari), Malayalam, Telugu, or Kannada have glyphs in that font,
         so switching languages used to fall back to whatever generic font the
         visitor's OS happened to ship, which looked inconsistent next to the
         rest of the site's typography. A Noto Sans family per script is
         loaded alongside Outfit and applied via the :lang() rules in
         index.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Noto+Sans+Malayalam:wght@400;500;600;700;800;900&family=Noto+Sans+Telugu:wght@400;500;600;700;800;900&family=Noto+Sans+Kannada:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
