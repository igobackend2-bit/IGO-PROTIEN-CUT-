name: protein_cuts
description: A premium protein-focused food delivery app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  speech_to_text: ^7.0.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
